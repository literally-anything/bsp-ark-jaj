name: CI

# - carrier-bsp: stone/ and the derived overlay files must be exactly what
#   upstream.env produces.
# - build: the extension installs and builds against the Avocado feed, and
#   Avocado's own overlay compiler + Tegra merge hook, run in the SDK, produce
#   exactly the committed DTB (so switching to device_tree_overlays later
#   changes nothing that gets flashed).
# - drift (weekly): fail if the feed's newest jetson-orin-nx snapshot ships a
#   different flash BSP than the one the DTB was generated from.
#
# ubuntu-24.04 is pinned, not ubuntu-latest: its dtc 1.7.0 matches the
# Avocado 2024 SDK's, and build-carrier-bsp.sh refuses other versions.
#
# No publish job: publishing to the Avocado feed needs an Avocado Connect org
# that trusts this repo. Consumers pin a release tag with a git source.

on:
  pull_request:
  push:
    branches: [main]
    tags: ['[0-9]+.[0-9]+.[0-9]+', '[0-9]+.[0-9]+.[0-9]+-*']
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  carrier-bsp:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y device-tree-compiler cpp libarchive-tools
      - name: Regenerate and compare
        run: scripts/build-carrier-bsp.sh --check

  tag-matches-version:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Tag must equal the extension's version
        run: |
          version=$(python3 -c "import yaml; print(yaml.safe_load(open('avocado.yaml'))['extensions']['avocado-bsp-ark-jaj']['version'])")
          [ "$version" = "$GITHUB_REF_NAME" ] || { echo "::error::tag $GITHUB_REF_NAME != avocado.yaml version $version"; exit 1; }

  build:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    env:
      AVOCADO_DISTRO_RELEASE: '2024'
      AVOCADO_DISTRO_CHANNEL: edge
    steps:
      - uses: actions/checkout@v5
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y device-tree-compiler cpp libarchive-tools
      - name: Install avocado CLI
        uses: avocado-linux/actions/setup-avocado-cli@v1
        with:
          version: latest
      - name: avocado sdk install
        run: avocado sdk install -f --no-tui --target jetson-orin-nx
      - name: avocado ext install
        run: avocado ext install -f --no-tui avocado-bsp-ark-jaj --target jetson-orin-nx
      - name: avocado ext build
        run: avocado ext build --no-tui avocado-bsp-ark-jaj --target jetson-orin-nx
      - name: Avocado's overlay hook produces the committed DTB
        run: |
          scripts/build-carrier-bsp.sh --check   # also fetches the pinned flash BSP
          scripts/check-avocado-hook.sh

  drift:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Newest snapshot still ships the pinned flash BSP
        run: scripts/build-carrier-bsp.sh --drift
